name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  # --- JOB 1: LINUX BUILD ---
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 1. Build Wheels & Source Dist
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist --find-interpreter
          sdist: true
          manylinux: auto

      # 2. Build Standalone Binary (PyInstaller)
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build Standalone Executable
        run: |
          python -m pip install --upgrade pip pyinstaller
          python -m pip install --find-links dist asciify-term
          printf "from ascii_art.cli import main\nmain()\n" > entry_point.py
          pyinstaller --onefile --hidden-import ascii_art.ascii_art_rs --name asciify-linux entry_point.py

      # 3. Upload Artifacts
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-linux
          path: |
            dist/*.whl
            dist/*.tar.gz

      - name: Upload executable
        uses: actions/upload-artifact@v7
        with:
          name: binary-linux
          path: dist/asciify-linux

  # --- JOB 2: WINDOWS BUILD ---
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # 1. Build Wheels
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist --find-interpreter

      # 2. Build Standalone Binary (PyInstaller)
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build Standalone Executable
        run: |
          python -m pip install --upgrade pip pyinstaller
          python -m pip install --find-links dist asciify-term
          python -c "from pathlib import Path; Path('entry_point.py').write_text('from ascii_art.cli import main\nmain()\n', encoding='utf-8')"
          pyinstaller --onefile --hidden-import ascii_art.ascii_art_rs --name asciify-windows entry_point.py

      # 3. Upload Artifacts
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-windows
          path: dist/*.whl

      - name: Upload executable
        uses: actions/upload-artifact@v7
        with:
          name: binary-windows
          path: dist/asciify-windows.exe

  # --- JOB 3: MACOS BUILD ---
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      # 1. Build Wheels
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist --find-interpreter

      # 2. Build Standalone Binary (PyInstaller)
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build Standalone Executable
        run: |
          python -m pip install --upgrade pip pyinstaller
          python -m pip install --find-links dist asciify-term
          printf "from ascii_art.cli import main\nmain()\n" > entry_point.py
          pyinstaller --onefile --hidden-import ascii_art.ascii_art_rs --name asciify-macos entry_point.py

      # 3. Upload Artifacts
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-macos
          path: dist/*.whl

      - name: Upload executable
        uses: actions/upload-artifact@v7
        with:
          name: binary-macos
          path: dist/asciify-macos

  # --- JOB 4: PUBLISH & RELEASE ---
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [linux, windows, macos]
    environment:
      name: pypi
      url: https://pypi.org/p/asciify-term
    steps:
      # 1. Download Wheels
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      # 2. Download Binaries
      - uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          path: binaries
          merge-multiple: true

      # 3. Create GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            binaries/*
          draft: false
          prerelease: false
          generate_release_notes: true

      # 4. Publish to PyPI
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
